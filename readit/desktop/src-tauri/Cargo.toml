[package]
name = "readit-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
cpal = "0.15"
crossbeam-channel = "0.5.17"
hex = "0.4.3"
parking_lot = "0.13.0"
readit-core = { version = "0.1.0", path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["native-certs", "proxy-from-env"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

# Speech engine: statically linked on Windows and macOS (no extra libraries in the installer), shared on Linux.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["tts", "download-binaries", "static"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["tts", "download-binaries"] }
