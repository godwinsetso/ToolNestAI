name: Desktop

on:
  push:
    paths: ["readit/**", ".github/workflows/**"]
  pull_request:
    paths: ["readit/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  test:
    name: Desktop tests (player, voices, audio)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: readit/desktop/src-tauri }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - name: PDFium and sample documents
        run: |
          mkdir -p readit/vendor/pdfium/linux-x64
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-x64.tgz" | tar xz -C readit/vendor/pdfium/linux-x64
          pip install python-docx python-pptx reportlab ebooklib pypdf pillow && python3 readit/tools/make_fixtures.py
      - name: cargo test
        working-directory: readit/desktop/src-tauri
        env: { READIT_PDFIUM_DIR: "${{ github.workspace }}/readit/vendor/pdfium/linux-x64/lib" }
        run: cargo test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: readit/desktop/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle PDFium and the offline voice
        shell: bash
        run: readit/scripts/fetch-desktop-deps.sh windows
      - name: Build installer
        working-directory: readit/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis msi
      - uses: actions/upload-artifact@v4
        with:
          name: readit-windows
          path: |
            readit/desktop/src-tauri/target/release/bundle/nsis/*.exe
            readit/desktop/src-tauri/target/release/bundle/msi/*.msi

  linux:
    name: Linux packages
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: readit/desktop/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - name: Build the app once so the speech engine libraries are downloaded
        working-directory: readit/desktop/src-tauri
        run: cargo build --release
      - run: readit/scripts/fetch-desktop-deps.sh linux
      - name: Build packages
        working-directory: readit/desktop
        run: |
          npm ci
          npx tauri build --bundles deb appimage
      - uses: actions/upload-artifact@v4
        with:
          name: readit-linux
          path: |
            readit/desktop/src-tauri/target/release/bundle/deb/*.deb
            readit/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS app (experimental)
    needs: test
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: readit/scripts/fetch-desktop-deps.sh macos
      - working-directory: readit/desktop
        run: |
          npm ci
          npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: readit-macos
          path: readit/desktop/src-tauri/target/release/bundle/dmg/*.dmg
